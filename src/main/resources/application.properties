spring.application.name=TwinScheduler

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# Scheduling Configuration (milliseconds)
scheduler.healthcheck.fixedRate=60000
scheduler.autoscale.fixedRate=300000
scheduler.autoscale.minInstances=2
scheduler.autoscale.imageName=twin-autoscaler-image


# Endpoint Configuration
endpoints.extractor=http://50.19.4.222:8080/actuator/health
endpoints.lambda.healthcheck=http://50.19.4.222:8080/actuator/health
endpoints.autoscale=https://1i4vzoi726.execute-api.us-east-1.amazonaws.com/twinAutoscalerStage/TwinAutoScaler

# Thread Pool Configuration
threadpool.size=10
