spring.application.name=TwinScheduler

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=1234
spring.jpa.hibernate.ddl-auto=update
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.maximum-pool-size=20


# Scheduling Configuration (milliseconds)
scheduler.healthcheck.fixedRate=30000
scheduler.autoscale.fixedRate=30000
scheduler.autoscale.minInstances=2
scheduler.autostart.minShutdownInstances=0
scheduler.autoscale.imageName=Remote_Soultion_Containerize_V2

# Endpoint Configuration
endpoints.lambda.healthcheck=https://7ovcogjfi8.execute-api.us-west-2.amazonaws.com/default/HealthChecker2
endpoints.lambda.healthcheck.retries=10
endpoints.lambda.healthcheck.delay=30000
endpoints.autoscale=https://7ovcogjfi8.execute-api.us-west-2.amazonaws.com/default/AutoScaler
endpoints.autostart=https://7ovcogjfi8.execute-api.us-west-2.amazonaws.com/default/AutoRestart
endpoints.autostop=https://7ovcogjfi8.execute-api.us-west-2.amazonaws.com/default/AutoStopper
endpoints.statecheck=https://7ovcogjfi8.execute-api.us-west-2.amazonaws.com/default/StateChecker
endpoints.autoterminate=https://7ovcogjfi8.execute-api.us-west-2.amazonaws.com/default/AutoTerminater
endpoints.shutdownpooladder=https://7ovcogjfi8.execute-api.us-west-2.amazonaws.com/default/ShutdownpoolAdder

#Extractor configs
extractor.application.port=8080

#twin.application.name=java.exe
# Thread Pool Configuration
threadpool.size=10